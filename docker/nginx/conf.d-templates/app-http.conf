# Same as conf.d/app-http.conf — copied by entrypoint at runtime
upstream kuber_backend {
    server backend:8080;
    keepalive 32;
}

upstream kuber_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/proxy-locations.conf;
}
