          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /ea-strategies/catalog:
    get:
      operationId: getEAStrategyCatalog
      tags: [ea-strategies]
      responses:
        "200":
          description: Platform EA strategy catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EACatalogItem"

  /ea-strategies/catalog/{catalogId}/subscribe:
    post:
      operationId: subscribeToEAStrategy
      tags: [ea-strategies]
      parameters:
        - name: catalogId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EASubscribeInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EASubscription"

  /ea-strategies/subscriptions/my:
    get:
      operationId: getMyEASubscriptions
      tags: [ea-strategies]
      responses:
        "200":
          description: User EA subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EASubscription"

  /ea-strategies/subscriptions/{id}/download:
    get:
      operationId: downloadEAStrategy
      tags: [ea-strategies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /mt5-relay:
    post:
      operationId: submitMt5Request
      tags: [mt5-relay]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mt5RelayInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mt5RelayRequest"
