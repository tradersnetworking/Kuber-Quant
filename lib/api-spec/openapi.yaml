    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit KYC application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycRecord"

  /referral/stats:
