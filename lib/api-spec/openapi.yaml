      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EAStrategyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EAStrategy"

  /ea-strategies/{id}:
    get:
      operationId: getEAStrategy
      tags: [ea-strategies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: EA strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EAStrategy"

  /ea-strategies/{id}/activate:
    post:
      operationId: activateEAStrategy
      tags: [ea-strategies]
      parameters:
        - name: id
