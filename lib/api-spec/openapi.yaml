      operationId: updateUserRoleSuperAdmin
      tags: [super-admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperAdminRoleInput"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /super-admin/mt5-requests:
    get:
      operationId: getSuperAdminMt5Requests
      tags: [super-admin]
      responses:
        "200":
          description: All MT5 relay requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mt5RelayRequest"

  /super-admin/mt5-requests/{id}/forward:
    post:
      operationId: forwardMt5Request
      tags: [super-admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Forwarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /super-admin/mt5-requests/{id}/status:
    patch:
      operationId: updateMt5RequestStatus
      tags: [super-admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mt5RequestStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /super-admin/settings/mt5-endpoint:
    get:
      operationId: getMt5Endpoint
      tags: [super-admin]
      responses:
        "200":
          description: MT5 external endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
    post:
      operationId: setMt5Endpoint
      tags: [super-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mt5EndpointInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

