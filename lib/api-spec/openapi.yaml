components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
        otpauthUri:
          type: string

    TwoFactorCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TwoFactorVerifyInput:
      type: object
      required: [tempToken, code]
      properties:
        tempToken:
          type: string
        code:
          type: string

    RegisterInput:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        fullName:
          type: string
        referralCode:
          type: string
        phone:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    GoogleAuthInput:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, fullName, role, kycStatus, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, manager, admin]
        kycStatus:
          type: string
          enum: [pending, submitted, verified, rejected]
        balanceFiat:
          type: ["number", "null"]
        balanceCrypto:
          type: ["number", "null"]
        totalProfit:
          type: ["number", "null"]
        referralCode:
          type: ["string", "null"]
        referralCount:
          type: ["integer", "null"]
        referralEarnings:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        twoFactorEnabled:
          type: boolean
        createdAt:
          type: string

    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [user, manager, admin]
        kycStatus:
          type: string
          enum: [pending, submitted, verified, rejected]
        balanceFiat:
          type: number
        balanceCrypto:
          type: number
        isActive:
          type: boolean
        managerId:
          type: ["integer", "null"]

    DashboardSummary:
      type: object
      required: [totalBalance, totalProfit, totalInvested, activeInvestments, profitPercentage, fiatBalance, cryptoBalance]
      properties:
        totalBalance:
          type: number
        totalProfit:
          type: number
        totalInvested:
          type: number
        activeInvestments:
          type: integer
        profitPercentage:
          type: number
        fiatBalance:
          type: number
        cryptoBalance:
          type: number
        followedTraders:
          type: integer
        activeAlgoStrategies:
          type: integer
        referralEarnings:
          type: number
        pendingWithdrawals:
          type: number
        unreadNotifications:
          type: integer

    ChartPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
        value:
          type: number

    ActivityItem:
      type: object
      required: [id, type, description, amount, currency, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, profit, investment, trade, referral]
        description:
          type: string
        amount:
          type: number
        currency:
          type: string
        createdAt:
          type: string

    Investment:
      type: object
      required: [id, userId, type, amount, currency, profit, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [algo, copy, ea, manual, plan]
        planName:
          type: ["string", "null"]
        planId:
          type: ["integer", "null"]
        amount:
          type: number
        currency:
          type: string
          enum: [USD, EUR, BTC, ETH, USDT, INR]
        profit:
          type: number
        profitPercent:
          type: number
        roiPercent:
          type: ["number", "null"]
        status:
          type: string
          enum: [active, completed, pending, withdrawn]
        maturityDate:
          type: ["string", "null"]
        createdAt:
          type: string

    InvestmentInput:
      type: object
