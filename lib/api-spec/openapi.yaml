openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Kuber Capital Trading Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: investments
  - name: trades
  - name: copy-trading
  - name: ea-strategies
  - name: transactions
  - name: dashboard
  - name: admin
  - name: kyc
  - name: referral
  - name: mt5
  - name: tickets
  - name: notifications
  - name: plans
  - name: wallet
  - name: manager
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/google:
    post:
      operationId: googleAuth
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthInput"
      responses:
        "200":
          description: Authenticated via Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/2fa/setup:
    post:
      operationId: twoFactorSetup
      tags: [auth]
      responses:
        "200":
          description: 2FA setup info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"

  /auth/2fa/enable:
    post:
      operationId: twoFactorEnable
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/2fa/disable:
    post:
      operationId: twoFactorDisable
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/2fa/verify-login:
    post:
      operationId: twoFactorVerifyLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyInput"
      responses:
        "200":
          description: Login verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/portfolio-chart:
    get:
      operationId: getPortfolioChart
      tags: [dashboard]
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartPoint"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      responses:
        "200":
          description: Investments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
    post:
      operationId: createInvestment
      tags: [investments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}:
    get:
      operationId: getInvestment
      tags: [investments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Investment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}/withdraw:
    post:
      operationId: withdrawInvestment
      tags: [investments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /trades/stats:
    get:
      operationId: getTradeStats
      tags: [trades]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStats"

  /algo-strategies:
    get:
      operationId: listAlgoStrategies
      tags: [trades]
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlgoStrategy"

  /algo-strategies/{id}/subscribe:
    post:
      operationId: subscribeAlgoStrategy
      tags: [trades]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategySubscription"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /copy-traders:
    get:
      operationId: listCopyTraders
      tags: [copy-trading]
      responses:
        "200":
          description: Copy traders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CopyTrader"

  /copy-traders/{id}:
    get:
      operationId: getCopyTrader
      tags: [copy-trading]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyTrader"

  /copy-traders/{id}/follow:
    post:
      operationId: followCopyTrader
      tags: [copy-trading]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyTradeInput"
      responses:
        "200":
          description: Following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /copy-traders/{id}/unfollow:
    post:
      operationId: unfollowCopyTrader
      tags: [copy-trading]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /ea-strategies:
    get:
      operationId: listEAStrategies
      tags: [ea-strategies]
      responses:
        "200":
          description: EA strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EAStrategy"
