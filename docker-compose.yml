# Kuber Quant — production Docker Compose (Ubuntu 24 LTS VPS / Hostinger Docker Manager)
# Usage: cp .env.docker.example .env && docker compose up -d --build

name: kuber-quant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kuber-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kuber}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuber_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuber} -d ${POSTGRES_DB:-kuber}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: kuber-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - kuber_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: kuber-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      SERVE_SPA: "false"
      UPLOAD_DIR: /app/uploads
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kuber}
      POSTGRES_DB: ${POSTGRES_DB:-kuber}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kuber}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kuber}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      APP_URL: ${APP_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      PM2_INSTANCES: ${PM2_INSTANCES:-1}
      PM2_MAX_MEMORY: ${PM2_MAX_MEMORY:-768M}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPPORT_IMAP_ENABLED: ${SUPPORT_IMAP_ENABLED:-true}
      SUPPORT_IMAP_HOST: ${SUPPORT_IMAP_HOST:-imap.hostinger.com}
      SUPPORT_IMAP_PORT: ${SUPPORT_IMAP_PORT:-993}
      SUPPORT_IMAP_SECURE: ${SUPPORT_IMAP_SECURE:-true}
      SUPPORT_IMAP_USER: ${SUPPORT_IMAP_USER:-}
      SUPPORT_IMAP_PASS: ${SUPPORT_IMAP_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID:-}
      PHONEPE_SALT_KEY: ${PHONEPE_SALT_KEY:-}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX:-1}
      PHONEPE_ENV: ${PHONEPE_ENV:-UAT}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYU_MERCHANT_KEY: ${PAYU_MERCHANT_KEY:-}
      PAYU_MERCHANT_SALT: ${PAYU_MERCHANT_SALT:-}
      PAYU_ENV: ${PAYU_ENV:-test}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - kuber_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: kuber-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - kuber_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: kuber-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ENABLE_SSL: ${ENABLE_SSL:-false}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/conf.d-templates:/etc/nginx/conf.d-templates:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    configs:
      - source: nginx_entrypoint
        target: /docker-entrypoint-custom.sh
        mode: 0755
    networks:
      - kuber_net
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

configs:
  nginx_entrypoint:
    file: ./docker/nginx/docker-entrypoint.sh

networks:
  kuber_net:
    driver: bridge
    name: kuber_quant_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
  certbot_webroot:
